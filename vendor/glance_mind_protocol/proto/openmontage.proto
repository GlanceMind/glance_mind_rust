  optional string input_mode = 27 [json_name = "input_mode"];
  optional string output_profile = 28 [json_name = "output_profile"];
  optional string renderer_family = 29 [json_name = "renderer_family"];
  optional string delivery_promise_json = 30 [json_name = "delivery_promise_json"];
  optional string music_plan_json = 31 [json_name = "music_plan_json"];
  optional string voice_selection_json = 32 [json_name = "voice_selection_json"];
  repeated OpenMontageToolInvocation tool_invocations = 33 [json_name = "tool_invocations"];
  repeated OpenMontageArtifactPayload artifact_inputs = 34 [json_name = "artifact_inputs"];
  optional OpenMontagePipelineManifest pipeline_manifest = 35 [json_name = "pipeline_manifest"];
  optional string preflight_policy = 36 [json_name = "preflight_policy"];
