  string pipeline_type = 3 [json_name = "pipeline_type"];
  string stage = 4;
  string status = 5;
  string timestamp = 6;
  optional string style_playbook = 7 [json_name = "style_playbook"];
  optional string checkpoint_policy = 8 [json_name = "checkpoint_policy"];
  optional bool human_approval_required = 9 [json_name = "human_approval_required"];
  optional bool human_approved = 10 [json_name = "human_approved"];
  repeated OpenMontageArtifactPayload artifacts = 11;
  optional string artifacts_json = 12 [json_name = "artifacts_json"];
  optional string review_json = 13 [json_name = "review_json"];
  optional string cost_snapshot_json = 14 [json_name = "cost_snapshot_json"];
