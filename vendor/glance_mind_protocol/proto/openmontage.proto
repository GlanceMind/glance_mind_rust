  string emitted_at = 14 [json_name = "emitted_at"];
  optional OpenMontageToolInvocation tool_invocation = 15 [json_name = "tool_invocation"];
  optional OpenMontageToolResult tool_result = 16 [json_name = "tool_result"];
  repeated OpenMontageArtifactPayload artifact_payloads = 17 [json_name = "artifact_payloads"];
  optional OpenMontageCheckpoint checkpoint_full = 18 [json_name = "checkpoint_full"];
  optional OpenMontagePreflightSnapshot preflight = 19;
}

message OpenMontageCallbackAck {
  bool received = 1;
  string event_id = 2 [json_name = "event_id"];
  uint64 next_expected_sequence = 3 [json_name = "next_expected_sequence"];
  optional string message = 4;
}
