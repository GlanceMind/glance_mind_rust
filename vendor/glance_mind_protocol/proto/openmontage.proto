  OPEN_MONTAGE_ERROR_CODE_IDEMPOTENCY_CONFLICT = 4;
  OPEN_MONTAGE_ERROR_CODE_PIPELINE_NOT_FOUND = 5;
  OPEN_MONTAGE_ERROR_CODE_APPROVAL_REQUIRED = 6;
  OPEN_MONTAGE_ERROR_CODE_APPROVAL_REJECTED = 7;
  OPEN_MONTAGE_ERROR_CODE_PROVIDER_UNAVAILABLE = 8;
  OPEN_MONTAGE_ERROR_CODE_RENDER_FAILED = 9;
  OPEN_MONTAGE_ERROR_CODE_INTERNAL_ERROR = 10;
  OPEN_MONTAGE_ERROR_CODE_TOOL_NOT_FOUND = 11;
  OPEN_MONTAGE_ERROR_CODE_TOOL_VALIDATION_ERROR = 12;
  OPEN_MONTAGE_ERROR_CODE_CHECKPOINT_VALIDATION_ERROR = 13;
  OPEN_MONTAGE_ERROR_CODE_ARTIFACT_VALIDATION_ERROR = 14;
  OPEN_MONTAGE_ERROR_CODE_RUNTIME_UNAVAILABLE = 15;
  OPEN_MONTAGE_ERROR_CODE_BUDGET_EXCEEDED = 16;
  OPEN_MONTAGE_ERROR_CODE_LIVE_PROVIDER_NOT_APPROVED = 17;
}

message OpenMontageJobRef {
  string job_id = 1 [json_name = "job_id"];
  string request_id = 2 [json_name = "request_id"];
  string project_id = 3 [json_name = "project_id"];
  string correlation_id = 4 [json_name = "correlation_id"];
  string idempotency_key = 5 [json_name = "idempotency_key"];
}

message OpenMontageCallbackConfig {
  string callback_url = 1 [json_name = "callback_url"];
  string callback_secret_ref = 2 [json_name = "callback_secret_ref"];
  repeated string event_types = 3 [json_name = "event_types"];
}

message OpenMontageInputAsset {
  OpenMontageInputAssetKind kind = 1;
  string role = 2;
  string uri = 3;
  optional string mime_type = 4 [json_name = "mime_type"];
  optional uint32 width_px = 5 [json_name = "width_px"];
  optional uint32 height_px = 6 [json_name = "height_px"];
  optional uint32 duration_ms = 7 [json_name = "duration_ms"];
  optional string metadata_json = 8 [json_name = "metadata_json"];
}

message OpenMontageSchemaField {
  string path = 1;
  bool required = 2;
  string json_type = 3 [json_name = "json_type"];
  repeated string enum_values = 4 [json_name = "enum_values"];
  optional string default_json = 5 [json_name = "default_json"];
  optional string description = 6;
}

message OpenMontageResourceProfile {
  uint32 cpu_cores = 1 [json_name = "cpu_cores"];
  uint32 ram_mb = 2 [json_name = "ram_mb"];
  uint32 vram_mb = 3 [json_name = "vram_mb"];
  uint32 disk_mb = 4 [json_name = "disk_mb"];
  bool network_required = 5 [json_name = "network_required"];
}

message OpenMontageRetryPolicy {
  uint32 max_retries = 1 [json_name = "max_retries"];
  double backoff_seconds = 2 [json_name = "backoff_seconds"];
  repeated string retryable_errors = 3 [json_name = "retryable_errors"];
}

message OpenMontageToolContract {
  string name = 1;
  string version = 2;
  string tier = 3;
  string capability = 4;
  string provider = 5;
  string stability = 6;
  string status = 7;
  string execution_mode = 8 [json_name = "execution_mode"];
  string determinism = 9;
  string runtime = 10;
  string module_path = 11 [json_name = "module_path"];
  string usage_location = 12 [json_name = "usage_location"];
  repeated string dependencies = 13;
  string install_instructions = 14 [json_name = "install_instructions"];
  repeated string capabilities = 15;
  repeated OpenMontageSchemaField input_fields = 16 [json_name = "input_fields"];
  repeated OpenMontageSchemaField output_fields = 17 [json_name = "output_fields"];
  optional string input_schema_json = 18 [json_name = "input_schema_json"];
  optional string output_schema_json = 19 [json_name = "output_schema_json"];
  optional string artifact_schema_json = 20 [json_name = "artifact_schema_json"];
  optional string progress_schema_json = 21 [json_name = "progress_schema_json"];
  optional string supports_json = 22 [json_name = "supports_json"];
  repeated string best_for = 23 [json_name = "best_for"];
  repeated string not_good_for = 24 [json_name = "not_good_for"];
  optional string provider_matrix_json = 25 [json_name = "provider_matrix_json"];
  optional OpenMontageResourceProfile resource_profile = 26 [json_name = "resource_profile"];
  optional OpenMontageRetryPolicy retry_policy = 27 [json_name = "retry_policy"];
  string resume_support = 28 [json_name = "resume_support"];
  repeated string side_effects = 29 [json_name = "side_effects"];
  optional string fallback = 30;
  repeated string fallback_tools = 31 [json_name = "fallback_tools"];
  repeated string agent_skills = 32 [json_name = "agent_skills"];
  repeated string user_visible_verification = 33 [json_name = "user_visible_verification"];
  optional double quality_score = 34 [json_name = "quality_score"];
  optional double historical_success_rate = 35 [json_name = "historical_success_rate"];
  optional double latency_p50_seconds = 36 [json_name = "latency_p50_seconds"];
  optional string render_engines_json = 37 [json_name = "render_engines_json"];
  optional string render_runtimes_json = 38 [json_name = "render_runtimes_json"];
  optional string remotion_note = 39 [json_name = "remotion_note"];
  optional string hyperframes_note = 40 [json_name = "hyperframes_note"];
  optional string runtime_governance = 41 [json_name = "runtime_governance"];
  optional string raw_info_json = 42 [json_name = "raw_info_json"];
  repeated string related_skills = 43 [json_name = "related_skills"];
}

message OpenMontageToolInvocation {
  string invocation_id = 1 [json_name = "invocation_id"];
  string stage = 2;
  string tool_name = 3 [json_name = "tool_name"];
  string role = 4;
  string operation = 5;
  string provider = 6;
  string capability = 7;
  string input_json = 8 [json_name = "input_json"];
  optional string idempotency_key = 9 [json_name = "idempotency_key"];
  optional double max_cost_usd = 10 [json_name = "max_cost_usd"];
  bool dry_run = 11 [json_name = "dry_run"];
  repeated string expected_artifact_roles = 12 [json_name = "expected_artifact_roles"];
  optional string contract_version = 13 [json_name = "contract_version"];
  optional string metadata_json = 14 [json_name = "metadata_json"];
}

message OpenMontageToolResult {
  string invocation_id = 1 [json_name = "invocation_id"];
  string tool_name = 2 [json_name = "tool_name"];
  bool success = 3;
  optional string data_json = 4 [json_name = "data_json"];
  repeated string artifact_uris = 5 [json_name = "artifact_uris"];
  repeated OpenMontageArtifact artifacts = 6;
  optional string error = 7;
  double cost_usd = 8 [json_name = "cost_usd"];
  double duration_seconds = 9 [json_name = "duration_seconds"];
  optional uint64 seed = 10;
  optional string model = 11;
  optional string raw_artifacts_json = 12 [json_name = "raw_artifacts_json"];
  optional string metadata_json = 13 [json_name = "metadata_json"];
}

message OpenMontagePipelineSubStage {
  string name = 1;
  optional string description = 2;
  optional string condition = 3;
  optional bool human_approval_default = 4 [json_name = "human_approval_default"];
  repeated string tools_available = 5 [json_name = "tools_available"];
  repeated string review_focus = 6 [json_name = "review_focus"];
}

message OpenMontagePipelineStage {
  string name = 1;
  optional string agent = 2;
  optional string skill = 3;
  repeated string required_artifacts_in = 4 [json_name = "required_artifacts_in"];
  repeated string optional_artifacts_in = 5 [json_name = "optional_artifacts_in"];
  repeated string produces = 6;
  repeated string preferred_tools = 7 [json_name = "preferred_tools"];
  repeated string fallback_tools = 8 [json_name = "fallback_tools"];
  repeated string required_tools = 9 [json_name = "required_tools"];
  repeated string optional_tools = 10 [json_name = "optional_tools"];
  repeated string tools_available = 11 [json_name = "tools_available"];
  repeated string review_focus = 12 [json_name = "review_focus"];
  optional bool checkpoint_required = 13 [json_name = "checkpoint_required"];
  optional bool human_approval_default = 14 [json_name = "human_approval_default"];
  repeated string success_criteria = 15 [json_name = "success_criteria"];
