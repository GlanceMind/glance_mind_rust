  OPEN_MONTAGE_INPUT_ASSET_KIND_SUBTITLE = 8;
  OPEN_MONTAGE_INPUT_ASSET_KIND_NARRATION = 9;
  OPEN_MONTAGE_INPUT_ASSET_KIND_MUSIC = 10;
  OPEN_MONTAGE_INPUT_ASSET_KIND_SFX = 11;
  OPEN_MONTAGE_INPUT_ASSET_KIND_DIAGRAM = 12;
  OPEN_MONTAGE_INPUT_ASSET_KIND_ANIMATION = 13;
  OPEN_MONTAGE_INPUT_ASSET_KIND_CODE_SNIPPET = 14;
