  OPEN_MONTAGE_ARTIFACT_KIND_DIRECTORY = 7;
  OPEN_MONTAGE_ARTIFACT_KIND_NARRATION = 8;
  OPEN_MONTAGE_ARTIFACT_KIND_MUSIC = 9;
  OPEN_MONTAGE_ARTIFACT_KIND_SFX = 10;
  OPEN_MONTAGE_ARTIFACT_KIND_DIAGRAM = 11;
  OPEN_MONTAGE_ARTIFACT_KIND_ANIMATION = 12;
  OPEN_MONTAGE_ARTIFACT_KIND_CODE_SNIPPET = 13;
  OPEN_MONTAGE_ARTIFACT_KIND_FONT = 14;
  OPEN_MONTAGE_ARTIFACT_KIND_LUT = 15;
  OPEN_MONTAGE_ARTIFACT_KIND_REVIEW = 16;
