syntax = "proto3";
package glance_mind;

option java_package = "io.glancemind.protocol";
option java_multiple_files = true;

enum OpenMontageProtocolVersion {
  OPEN_MONTAGE_PROTOCOL_VERSION_UNSPECIFIED = 0;
  OPEN_MONTAGE_PROTOCOL_VERSION_V1 = 1;
}

enum OpenMontageJobStatus {
