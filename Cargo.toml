[workspace]
resolver = "2"
members = [
    "crates/db",
    "crates/api",
]
# Vendored glance_mind_protocol crate (synced via `make sync` in the
# glance_mind_protocol repo). Kept out of the workspace so it uses its
# own dependency versions from vendor/glance_mind_protocol/generated/rust/Cargo.toml.
exclude = [
    "vendor/glance_mind_protocol",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["GlanceMind Team"]

[workspace.dependencies]
# Database
diesel = { version = "2.2.0", features = [
    "postgres",
    "r2d2",
    "uuid",
    "chrono",
    "serde_json",
    "numeric",
    "64-column-tables",
] }
diesel_migrations = "2.2"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Date/Time
chrono = { version = "0.4", features = ["serde"] }

# UUID
uuid = { version = "1.4", features = ["serde", "v4"] }

# Numeric
bigdecimal = { version = "0.4", features = ["serde"] }

# Web Framework
axum = { version = "0.6.18", features = ["headers", "multipart"] }
tokio = { version = "1.28", features = ["full"] }
tower = { version = "0.4.13", features = ["util"] }
tower-http = { version = "0.4.1", features = ["full"] }

# Environment
dotenvy = "0.15"
dotenv = "0.15"

# Tracing
tracing = "0.1"
tracing-subscriber = "0.3"

# Error handling
thiserror = "1.0"

# Async
async-trait = "0.1"

# Internal crates
glance_mind_db = { path = "crates/db" }
