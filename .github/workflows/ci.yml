name: Rust CI

on:
  pull_request:
    branches: ["main"]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".githooks/**"
      - "*.sql"
      - "*.py"
  workflow_dispatch:

# Cancel superseded runs: when a PR branch gets a new push, the in-flight run
# for the old commit is no longer interesting. Keyed on ref so each PR has its
# own group. This is the biggest waste cut on the constrained self-hosted runner.
concurrency:
  group: rust-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Same OOM guardrails as harness.yml: this job builds the full workspace
  # (clippy + tests) on the same constrained self-hosted runner. Trim debuginfo
  # to line tables, disable incremental, and cap parallel codegen so a debug
  # link step can't exhaust memory and drop the runner. (The test step also
  # passes --jobs 1, so its build stays single-threaded regardless.)
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "1"
  CARGO_PROFILE_TEST_DEBUG: "1"
  CARGO_BUILD_JOBS: "2"

jobs:
  test:
    name: Test
    runs-on: [self-hosted, front]
    services:
      db:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: aihub_user
          POSTGRES_PASSWORD: aihub_password
          POSTGRES_DB: aihub_db
        ports:
          - 15432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    environment: ci-env
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # No GitHub Actions cache: this self-hosted runner cannot reach the cache
      # backend, so the post-job save hangs at 0 MB/s and wedges the runner.
      # CARGO_HOME (~/.cargo) persists between jobs on the host, keeping the
      # crate registry warm without the remote cache.
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev protobuf-compiler libpq-dev postgresql-client

      - name: Apply database migrations
        # Run each up.sql in sort order via psql (multi-pass to handle dependency ordering).
        # This mirrors crates/db/docker/run-migrations.sh and is used instead of
        # `diesel migration run` because some historical migrations reset search_path
        # in ways that break Diesel's own __diesel_schema_migrations tracking table.
        run: |
          set -uo pipefail
          export PGPASSWORD=aihub_password

          mapfile -t pending < <(find crates/db/migrations -name "up.sql" | sort)

          pass=1
          while [ ${#pending[@]} -gt 0 ]; do
            echo "--- Migration pass ${pass} (${#pending[@]} files) ---"
            progress=0
            next_pending=()
            for migration in "${pending[@]}"; do
              name=$(basename "$(dirname "$migration")")
              if psql -v ON_ERROR_STOP=1 -1 -h localhost -p 15432 -U aihub_user -d aihub_db -f "$migration" > /dev/null 2>&1; then
                echo "  OK: $name"
                progress=$((progress + 1))
              else
                next_pending+=("$migration")
              fi
            done
            if [ ${#next_pending[@]} -eq 0 ]; then break; fi
            if [ "$progress" -eq 0 ]; then
              echo "ERROR: No progress in pass ${pass}. Remaining:"
              for m in "${next_pending[@]}"; do echo "  $(basename "$(dirname "$m")")"; done
              exit 1
            fi
            pending=("${next_pending[@]}")
            pass=$((pass + 1))
          done

          echo "All migrations applied."

          # Seed test data (users with id=1 etc. required by FK constraints in tests)
          psql -h localhost -p 15432 -U aihub_user -d aihub_db \
            -f crates/db/docker/init-test-data.sql > /dev/null
          echo "Test seed data applied."

      - name: Check Formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run Tests
        run: cargo test --workspace --verbose --jobs 1
        env:
          DATABASE_URL: postgres://aihub_user:aihub_password@localhost:15432/aihub_db
          RUST_BACKTRACE: 1
          JWT_SECRET: ${{ vars.JWT_SECRET }}
          JWT_TTL_IN_MINUTES: ${{ vars.JWT_TTL_IN_MINUTES }}
          PORT: ${{ vars.PORT }}
