name: Rust CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: self-hosted
    services:
      db:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: aihub_user
          POSTGRES_PASSWORD: aihub_password
          POSTGRES_DB: aihub_db
        ports:
          - 15432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    environment: ci-env
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev protobuf-compiler libpq-dev

      - name: Check Formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run Tests
        run: cargo test --workspace --verbose --jobs 1
        env:
          DATABASE_URL: postgres://aihub_user:aihub_password@localhost:15432/aihub_db
          RUST_BACKTRACE: 1
          JWT_SECRET: ${{ vars.JWT_SECRET }}
          JWT_TTL_IN_MINUTES: ${{ vars.JWT_TTL_IN_MINUTES }}
          PORT: ${{ vars.PORT }}
