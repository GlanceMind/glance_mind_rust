name: Rust CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: self-hosted
    services:
      db:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: aihub_user
          POSTGRES_PASSWORD: aihub_password
          POSTGRES_DB: aihub_db
        ports:
          - 15432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    environment: ci-env
    steps:
      - uses: actions/checkout@v4

      # Cargo path-dep `glance_mind_protocol = { path =
      # "../../../glance_mind_protocol/generated/rust" }` (declared in
      # crates/api/Cargo.toml after PR #3) resolves, relative to that
      # manifest, to `<github.workspace>/../glance_mind_protocol/...`.
      # CI must materialise that sibling repo before any cargo step
      # runs, otherwise `cargo metadata` fails with:
      #   failed to read `<workspace>/../glance_mind_protocol/generated/rust/Cargo.toml`
      #
      # Strategy: clone over SSH (self-hosted runner has the org SSH
      # key configured) to a sibling path next to $GITHUB_WORKSPACE.
      # If the clone target already exists from a warm runner, just
      # `git fetch + reset --hard` to sync — fast and idempotent.
      #
      # `actions/checkout` cannot write outside $GITHUB_WORKSPACE so
      # we have to use plain `git` here. Self-hosted runners can
      # write to $GITHUB_WORKSPACE/.. (it's just _work/<repo>/).
      - name: Sync glance_mind_protocol sibling checkout
        run: |
          set -euxo pipefail
          SIBLING="$GITHUB_WORKSPACE/../glance_mind_protocol"
          # Fall back from SSH (self-hosted org key) to HTTPS+token
          # (when secrets.MONOREPO_PROTOCOL_TOKEN is configured) so
          # GitHub-hosted runners can also use this workflow later.
          REMOTE_SSH="git@github.com:GlanceMind/glance_mind_protocol.git"
          REMOTE_HTTPS="https://x-access-token:${MONOREPO_PROTOCOL_TOKEN:-}@github.com/GlanceMind/glance_mind_protocol.git"

          if [ -d "$SIBLING/.git" ]; then
            git -C "$SIBLING" fetch --depth=1 origin main
            git -C "$SIBLING" reset --hard origin/main
          else
            rm -rf "$SIBLING"
            if git clone --depth=1 "$REMOTE_SSH" "$SIBLING" 2>/dev/null; then
              echo "Cloned protocol via SSH (org runner key)"
            elif [ -n "${MONOREPO_PROTOCOL_TOKEN:-}" ]; then
              git clone --depth=1 "$REMOTE_HTTPS" "$SIBLING"
              echo "Cloned protocol via HTTPS+token"
            else
              echo "::error::Cannot clone glance_mind_protocol — neither SSH nor MONOREPO_PROTOCOL_TOKEN works"
              exit 1
            fi
          fi
          test -f "$SIBLING/generated/rust/Cargo.toml" \
            || { echo "::error::protocol checkout missing generated/rust/Cargo.toml"; exit 1; }
        env:
          MONOREPO_PROTOCOL_TOKEN: ${{ secrets.MONOREPO_PROTOCOL_TOKEN }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Check Formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run Tests
        run: cargo test --workspace --verbose
        env:
          DATABASE_URL: postgres://aihub_user:aihub_password@localhost:15432/aihub_db
          RUST_BACKTRACE: 1
          JWT_SECRET: ${{ vars.JWT_SECRET }}
          JWT_TTL_IN_MINUTES: ${{ vars.JWT_TTL_IN_MINUTES }}
          PORT: ${{ vars.PORT }}
