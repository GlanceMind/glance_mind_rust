name: Rust CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: self-hosted
    services:
      db:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: aihub_user
          POSTGRES_PASSWORD: aihub_password
          POSTGRES_DB: aihub_db
        ports:
          - 15432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    environment: ci-env
    steps:
      - uses: actions/checkout@v4

      # Cargo path-dep `glance_mind_protocol = { path =
      # "../../../glance_mind_protocol/generated/rust" }` (declared in
      # crates/api/Cargo.toml after PR #3) resolves, relative to that
      # manifest, to `<github.workspace>/../glance_mind_protocol/...`.
      # CI must materialise that sibling repo before any cargo step
      # runs, otherwise `cargo metadata` fails with:
      #   failed to read `<workspace>/../glance_mind_protocol/generated/rust/Cargo.toml`
      #
      # actions/checkout cannot write outside `$GITHUB_WORKSPACE`, so
      # we clone it into the workspace at `_checkouts/` and then
      # symlink to the expected sibling path. `ln -snf` is idempotent
      # so re-runs on a warm self-hosted runner are safe.
      - name: Checkout glance_mind_protocol (Cargo path-dep sibling)
        uses: actions/checkout@v4
        with:
          repository: GlanceMind/glance_mind_protocol
          ref: main
          path: _checkouts/glance_mind_protocol
          # Self-hosted runner may need a token for private repos.
          # Falls back to the default GITHUB_TOKEN when secrets are
          # absent — that works only if the protocol repo is public
          # OR the runner has an SSH key configured for the org.
          token: ${{ secrets.MONOREPO_PROTOCOL_TOKEN || github.token }}

      - name: Symlink glance_mind_protocol to sibling path
        run: |
          set -euxo pipefail
          ln -snf "$GITHUB_WORKSPACE/_checkouts/glance_mind_protocol" \
                  "$GITHUB_WORKSPACE/../glance_mind_protocol"
          test -f "$GITHUB_WORKSPACE/../glance_mind_protocol/generated/rust/Cargo.toml" \
            || { echo "::error::sibling glance_mind_protocol checkout failed"; exit 1; }

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Check Formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run Tests
        run: cargo test --workspace --verbose
        env:
          DATABASE_URL: postgres://aihub_user:aihub_password@localhost:15432/aihub_db
          RUST_BACKTRACE: 1
          JWT_SECRET: ${{ vars.JWT_SECRET }}
          JWT_TTL_IN_MINUTES: ${{ vars.JWT_TTL_IN_MINUTES }}
          PORT: ${{ vars.PORT }}
