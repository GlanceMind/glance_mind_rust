name: Deploy API

on:
  # Manual trigger
  workflow_dispatch:
    inputs:
      run_migrations:
        description: "Run database migrations"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

  # Auto trigger on push to release branches
  push:
    branches:
      - "release/**"
      - "main"
    tags:
      - "release/**"
    # Only trigger when api or db changes
    paths:
      - "crates/api/**"
      - "crates/db/**"
      - "Cargo.toml"
      - "Cargo.lock"

jobs:
  # Check if migrations directory changed
  check-changes:
    name: Check for DB changes
    runs-on: ubuntu-latest
    outputs:
      db_changed: ${{ steps.check.outputs.db_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Check for db changes
        id: check
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -q "^crates/db/migrations/"; then
            echo "db_changed=true" >> $GITHUB_OUTPUT
            echo "Database migrations changed"
          else
            echo "db_changed=false" >> $GITHUB_OUTPUT
            echo "No database migration changes"
          fi

  deploy:
    name: Deploy to Prod
    runs-on: [self-hosted, prod]
    environment: prod
    needs: check-changes

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create .env file
        working-directory: crates/api
        run: |
          echo "PORT=${{ vars.PORT }}" >> .env
          echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> .env
          echo "JWT_TTL_IN_MINUTES=${{ vars.JWT_TTL_IN_MINUTES }}" >> .env
          echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" >> .env
          echo "AGENT_API_KEY=${{ secrets.AGENT_API_KEY }}" >> .env
          echo "AGENT_BASE_URL=${{ secrets.AGENT_BASE_URL }}" >> .env
          echo "LAOZHANG_API_KEY=${{ secrets.LAOZHANG_API_KEY }}" >> .env
          echo "TIKHUB_API_KEY=${{ secrets.TIKHUB_API_KEY }}" >> .env
          echo "TIKHUB_BASE_URL=${{ secrets.TIKHUB_BASE_URL }}" >> .env
          echo "RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}" >> .env
          echo "TURNSTILE_SECRET_KEY=${{ secrets.TURNSTILE_SECRET_KEY }}" >> .env

      - name: Install Rust (for migrations)
        if: needs.check-changes.outputs.db_changed == 'true' || github.event.inputs.run_migrations == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        if: needs.check-changes.outputs.db_changed == 'true' || github.event.inputs.run_migrations == 'true'
        uses: Swatinem/rust-cache@v2

      - name: Install PostgreSQL client library
        if: needs.check-changes.outputs.db_changed == 'true' || github.event.inputs.run_migrations == 'true'
        run: |
          echo "📦 Installing libpq-dev..."
          sudo apt-get update
          sudo apt-get install -y libpq-dev

      - name: Run Database Migrations
        if: needs.check-changes.outputs.db_changed == 'true' || github.event.inputs.run_migrations == 'true'
        run: |
          echo "🗄️ Running database migrations..."

          # Install diesel CLI if not available
          if ! command -v diesel &> /dev/null; then
            echo "Installing diesel_cli..."
            cargo install diesel_cli --no-default-features --features postgres
          fi

          # Replace host.docker.internal with localhost for non-Docker environment
          # (GitHub Actions runner runs directly on host, not in Docker)
          MIGRATION_DB_URL="${{ secrets.DATABASE_URL }}"
          MIGRATION_DB_URL="${MIGRATION_DB_URL//host.docker.internal/localhost}"

          # Run migrations
          cd crates/db
          DATABASE_URL="$MIGRATION_DB_URL" diesel migration run

          echo "✅ Migrations completed!"

      - name: Deploy with Docker Compose (optimized for minimal downtime)
        working-directory: crates/api
        run: |
          # Try to use docker-compose (v1/standalone) or fall back to docker compose (v2 plugin)
          if command -v docker-compose &> /dev/null; then
            COMPOSE_CMD="docker-compose"
          else
            COMPOSE_CMD="docker compose"
          fi

          echo "Using compose command: $COMPOSE_CMD"

          # Export buildx builder for docker-compose
          export DOCKER_BUILDKIT=1
          export COMPOSE_DOCKER_CLI_BUILD=1

          # Step 1: Build the new image first (while old service is still running)
          echo "🔨 Building new Docker image..."
          $COMPOSE_CMD -f docker-compose.prod.yml build --build-arg BUILDKIT_INLINE_CACHE=1

          # Step 2: Stop and remove old containers (quick operation)
          echo "🛑 Stopping old containers..."
          $COMPOSE_CMD -f docker-compose.prod.yml down

          # Step 3: Start new containers immediately with the pre-built image
          echo "🚀 Starting new containers..."
          $COMPOSE_CMD -f docker-compose.prod.yml up -d

          echo "✅ Deployment complete!"
