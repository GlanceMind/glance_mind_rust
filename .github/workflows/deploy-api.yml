name: Deploy API

on:
  workflow_dispatch:
    inputs:
      run_migrations:
        description: "Run database migrations"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
      no_cache:
        description: "Build without cache"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

  push:
    branches: ["release/**", "main"]
    tags: ["release/**"]
    paths:
      - "crates/api/**"
      - "crates/db/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/deploy-api.yml"

jobs:
  check-changes:
    name: Check for DB changes
    # Use self-hosted runner — GitHub-hosted runners require paid minutes
    # and get blocked when the org's billing / payment is unhealthy. The
    # only work here is a shallow git diff, so a self-hosted runner is
    # both cheaper and more reliable.
    runs-on: [self-hosted, Linux, backend]
    outputs:
      db_changed: ${{ steps.check.outputs.db_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check for db migration changes
        id: check
        run: |
          # Compare all commits in this push, not just HEAD~1
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            # First push or force push — check HEAD~1 as fallback
            BEFORE="HEAD~1"
          fi
          if git diff --name-only "$BEFORE" HEAD | grep -q "^crates/db/migrations/"; then
            echo "db_changed=true" >> $GITHUB_OUTPUT
            echo "Migration files changed between $BEFORE and HEAD"
          else
            echo "db_changed=false" >> $GITHUB_OUTPUT
            echo "No migration file changes between $BEFORE and HEAD"
          fi

  migrations:
    name: Run Database Migrations
    runs-on: [self-hosted, Linux, backend]
    environment: prod
    needs: check-changes
    if: needs.check-changes.outputs.db_changed == 'true' || github.event.inputs.run_migrations == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev protobuf-compiler libpq-dev
      - name: Run migrations
        run: |
          if ! command -v diesel &> /dev/null; then
            cargo install diesel_cli --no-default-features --features postgres
          fi
          MIGRATION_DB_URL="${{ secrets.DATABASE_URL }}"
          MIGRATION_DB_URL="${MIGRATION_DB_URL//host.docker.internal/localhost}"
          cd crates/db
          DATABASE_URL="$MIGRATION_DB_URL" diesel migration run

  deploy:
    name: Deploy API
    needs: [check-changes, migrations]
    if: always() && (needs.migrations.result == 'success' || needs.migrations.result == 'skipped')
    uses: GlanceMind/platform-infra/.github/workflows/deploy-service.yml@main
    with:
      service_name: glance-mind-api
      image_name: aihub_backend
      dockerfile: Dockerfile.api
      compose_file: crates/api/docker-compose.prod.yml
      env_file_dir: crates/api
      runner_labels: '["self-hosted", "backend", "p1"]'
      use_buildx: true
      no_cache: ${{ github.event.inputs.no_cache == 'true' }}
      health_check_url: "http://localhost:8000/health"
      container_name_filter: aihub_backend
    secrets:
      ENV_FILE: |
        PORT=${{ vars.PORT }}
        JWT_SECRET=${{ secrets.JWT_SECRET }}
        JWT_TTL_IN_MINUTES=${{ vars.JWT_TTL_IN_MINUTES || '30' }}
        DATABASE_URL=${{ secrets.DATABASE_URL }}
        DEEPSEEK_API_KEY=${{ secrets.DEEPSEEK_API_KEY }}
        DEEPSEEK_BASE_URL=${{ secrets.DEEPSEEK_BASE_URL || 'https://api.deepseek.com' }}
        DEEPSEEK_MODEL=${{ secrets.DEEPSEEK_MODEL || 'deepseek-chat' }}
        LAOZHANG_API_KEY=${{ secrets.LAOZHANG_API_KEY }}
        LAOZHANG_BASE_URL=${{ secrets.LAOZHANG_BASE_URL }}
        TIKHUB_API_KEY=${{ secrets.TIKHUB_API_KEY }}
        TIKHUB_BASE_URL=${{ secrets.TIKHUB_BASE_URL }}
        RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}
        TURNSTILE_SECRET_KEY=${{ secrets.TURNSTILE_SECRET_KEY }}
        XUNHUPAY_APP_ID=${{ secrets.XUNHUPAY_APP_ID }}
        XUNHUPAY_APP_SECRET=${{ secrets.XUNHUPAY_APP_SECRET }}
        XUNHUPAY_GATEWAY_URL=${{ secrets.XUNHUPAY_GATEWAY_URL }}
        API_BASE_URL=${{ secrets.API_BASE_URL }}
        AGENT_HUB_GATEWAY_URL=${{ vars.AGENT_HUB_GATEWAY_URL || 'http://host.docker.internal:8090' }}
        AGENT_HUB_TIMEOUT_SECS=${{ vars.AGENT_HUB_TIMEOUT_SECS || '30' }}
        OSS_ACCESS_KEY_ID=${{ secrets.OSS_ACCESS_KEY_ID }}
        OSS_ACCESS_KEY_SECRET=${{ secrets.OSS_ACCESS_KEY_SECRET }}
        OSS_ENDPOINT=${{ vars.OSS_ENDPOINT }}
        OSS_BUCKET=${{ vars.OSS_BUCKET }}
        NATS_URL=${{ vars.NATS_URL }}
        NATS_TOKEN=${{ secrets.NATS_TOKEN }}
        JIMENG_ACCESS_KEY_ID=${{ secrets.JIMENG_ACCESS_KEY_ID }}
        JIMENG_SECRET_ACCESS_KEY=${{ secrets.JIMENG_SECRET_ACCESS_KEY }}
        VIDU_API_KEY=${{ secrets.VIDU_API_KEY }}
        REDIS_URL=${{ vars.REDIS_URL }}
        DRAMA_DIRECT_WORKER_MODE=${{ vars.DRAMA_DIRECT_WORKER_MODE || 'false' }}
        DRAMA_CANONICAL_READS=${{ vars.DRAMA_CANONICAL_READS || 'false' }}
        DRAMA_CALLBACK_SECRET=${{ secrets.DRAMA_CALLBACK_SECRET }}
        OPENMONTAGE_INTERNAL_TOKEN=${{ secrets.OPENMONTAGE_INTERNAL_TOKEN }}
