name: OpenMontage API Tests

on:
  push:
    branches: [main]
    paths:
      - "crates/api/src/**/openmontage*"
      - "crates/api/tests/openmontage*"
      - "crates/db/**"
      - ".github/workflows/openmontage-api-tests.yml"
  pull_request:
    paths:
      - "crates/api/src/**/openmontage*"
      - "crates/api/tests/openmontage*"
      - "crates/db/**"
      - ".github/workflows/openmontage-api-tests.yml"

jobs:
  openmontage-api-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: glancemind_test
        ports:
          - 15432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:15432/glancemind_test
      REDIS_URL: redis://localhost:6379
      RUST_BACKTRACE: 1

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/api/target
          key: ${{ runner.os }}-cargo-omx-${{ hashFiles('**/Cargo.lock') }}

      - name: Install diesel CLI
        run: cargo install diesel_cli --no-default-features --features postgres --version 2.1.0 || true

      - name: Run migrations
        working-directory: crates/db
        run: diesel migration run

      - name: Run OpenMontage DB tests
        run: cargo test -p glance_mind_api --test openmontage_db_test -- --include-ignored

      - name: Run OpenMontage callback tests
        run: cargo test -p glance_mind_api --test openmontage_callback_test -- --include-ignored

      - name: Run OpenMontage callback auth tests
        run: cargo test -p glance_mind_api --test openmontage_callback_auth_test -- --include-ignored

      - name: Run OpenMontage enqueue tests
        run: cargo test -p glance_mind_api --test openmontage_enqueue_test -- --include-ignored

      - name: Run OpenMontage facade tests
        run: cargo test -p glance_mind_api --test openmontage_facade_test -- --include-ignored

      - name: Run OpenMontage assets tests
        run: cargo test -p glance_mind_api --test openmontage_assets_test -- --include-ignored

      - name: Run OpenMontage asset validation tests
        run: cargo test -p glance_mind_api --test openmontage_asset_validation_test -- --include-ignored

      - name: Run OpenMontage store wiring tests
        run: cargo test -p glance_mind_api --test openmontage_store_wiring_test -- --include-ignored

      - name: Run OpenMontage client runtime tests
        run: cargo test -p glance_mind_api --test openmontage_client_runtime_test -- --include-ignored

      - name: Run OpenMontage invariants tests
        run: cargo test -p glance_mind_api --test openmontage_invariants_test -- --include-ignored
