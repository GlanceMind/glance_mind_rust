name: Schema Sync Check

on:
  pull_request:
    branches:
      - main
    paths:
      - 'migrations/**'
      - 'src/schema.rs'

jobs:
  check-schema-sync:
    name: Check Schema Synchronization
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust toolchain
        uses: dtolnay/rust-action@stable
      
      - name: Install diesel_cli
        run: cargo install diesel_cli --no-default-features --features postgres
      
      - name: Run migrations
        env:
          DATABASE_URL: postgres://test:test@localhost:5432/test_db
        run: |
          diesel setup
          diesel migration run
      
      - name: Check schema is up to date
        env:
          DATABASE_URL: postgres://test:test@localhost:5432/test_db
        run: |
          diesel print-schema > /tmp/current_schema.rs
          
          if diff -q src/schema.rs /tmp/current_schema.rs > /dev/null; then
            echo "✓ Schema is synchronized"
          else
            echo "::error::Schema is out of sync with migrations!"
            echo ""
            echo "The schema.rs file does not match what the migrations produce."
            echo "Please run the following commands locally:"
            echo ""
            echo "  cd glance_mind_db"
            echo "  diesel migration run"
            echo "  diesel print-schema > src/schema.rs"
            echo "  git add src/schema.rs"
            echo "  git commit -m 'chore: update schema.rs'"
            echo ""
            echo "Diff:"
            diff src/schema.rs /tmp/current_schema.rs || true
            exit 1
          fi

  # Build check to ensure the project compiles
  build:
    name: Build Check
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust toolchain
        uses: dtolnay/rust-action@stable
      
      - name: Build
        run: cargo build --release
      
      - name: Run tests
        run: cargo test
