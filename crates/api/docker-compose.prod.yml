version: "3.8"

services:
  backend:
    # Use pre-built image (built by CI with buildx)
    # Falls back to building if image doesn't exist
    image: aihub_backend:latest
    build:
      context: ../..
      dockerfile: Dockerfile.api
    container_name: aihub_backend
    restart: always
    env_file:
      - .env
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
