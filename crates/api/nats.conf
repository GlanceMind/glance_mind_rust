# NATS Server Config — DM Group Control (API docker-compose)
# Ports: 4222 TCP, 8080 WebSocket, 8222 HTTP monitor

listen: 0.0.0.0:4222

websocket {
  listen: 0.0.0.0:8080
  no_tls: true
}

jetstream {
  store_dir: /data/nats
  max_mem: 256MB
  max_file: 2GB
}

authorization {
  token: $NATS_TOKEN
}

http_port: 8222
