[package]
name = "glance_mind_api"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "GlanceMind API Service"

[dependencies]
# Internal crates
glance_mind_db.workspace = true

# Web Framework
axum.workspace = true
tokio.workspace = true
tower.workspace = true
tower-http.workspace = true

# Database
diesel.workspace = true
r2d2 = "0.8.10"

# Serialization
serde.workspace = true
serde_json.workspace = true

# Date/Time & UUID
chrono.workspace = true
uuid.workspace = true
bigdecimal.workspace = true

# Environment & Config
dotenv.workspace = true

# Logging
tracing.workspace = true
tracing-subscriber.workspace = true

# Error handling
thiserror.workspace = true

# Regex (used by image_generation_validation)
regex = "1"

# Async
async-trait.workspace = true

# Auth & Security
jsonwebtoken = "8.3.0"
bcrypt = "0.14.0"
rand = "0.9.2"
base64 = "0.21"

# Validation
validator = { version = "0.16.1", features = ["derive"] }

# Testing
mockall = "0.11.4"

# Redis
redis = "1.0.2"

# NATS (DM Group Control)
async-nats = "0.37"
futures = "0.3"

# Streaming
tokio-stream = "0.1"

# HTTP Client
reqwest = { version = "0.11.22", features = ["json", "multipart", "stream"] }

# AI
rig-core = "0.27.0"

# Utilities
once_cell = "1.18.0"
rust_xlsxwriter = "0.82.0"
resend-rs = "0.20.0-rc.1"

# HTML parsing (knowledge base RAG)
scraper = "0.22"

# OSS + Jimeng (using reqwest directly with HMAC signing)
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"

# XunhuPay SDK (signing)
md5 = "0.7"

[dev-dependencies]
tower.workspace = true
hyper = { version = "0.14", features = ["full"] }
mime = "0.3.16"
