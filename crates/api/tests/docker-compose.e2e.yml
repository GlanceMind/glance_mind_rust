# =============================================================================
# GlanceMind API E2E Test Environment (via gm-e2e infra)
# =============================================================================
# Uses shared infrastructure from gm-e2e instead of duplicating services.
#
# Usage (mock — default):
#   docker compose -f tests/docker-compose.e2e.yml up -d
#   # run API tests...
#   docker compose -f tests/docker-compose.e2e.yml down -v
#
# Usage (real — no mocks):
#   GM_ENV_FILE=env/real.env docker compose \
#       -f tests/docker-compose.e2e.yml --profile real up -d
#
# Alternative: cd ../../../../gm-e2e && make infra-api-up
# =============================================================================

include:
  - path: ../../../../gm-e2e/infra/docker-compose.base.yml
  - path: ../../../../gm-e2e/infra/docker-compose.mocks.yml
  - path: ../../../../gm-e2e/infra/docker-compose.api.yml
